name: Release

# 推送形如 v* 的 tag 触发（例如 git tag v1.0.0 && git push --tags）
# 也可在 Actions 页面手动点击 "Run workflow" 触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 (留空则从 package.json 读取)'
        required: false
        default: ''
      draft:
        description: '是否创建为 draft (草稿)'
        type: boolean
        default: false

permissions:
  contents: write  # 用于创建 Release、推送 tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------
  # 阶段 1：生成 changelog + 解析 tag（轻量任务，跑在 ubuntu-latest）
  # ----------------------------------------------------------------
  prepare:
    name: Prepare Changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      base_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # push tag 触发时 checkout 默认 ref = refs/tags/v0.0.1（detached HEAD）
          # 需要 fetch-depth: 0 拉所有 history + fetch-tags: true 拉所有 tags
          fetch-depth: 0
          fetch-tags: true
          ref: main  # 显式 checkout 到 main HEAD，避开 detached HEAD on tag 的浅克隆问题

      - name: Capture release source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -e
          if [ -n "${{ inputs.tag }}" ]; then
            # workflow_dispatch 手动触发，且填了 tag
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # push tag 触发：用实际推送的 tag 名
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # workflow_dispatch 未填 tag：从 package.json 读取
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          # 校验 tag 格式 vX.Y.Z
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '$TAG' 不符合 vX.Y.Z 格式"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # ----------------------------------------------------------------
      # 版本号同步：把 tag 里的版本号写到 package.json + Cargo.toml
      # 让产物文件名（依赖 Cargo.toml）和 Release 名（依赖 tag）保持一致
      # ----------------------------------------------------------------
      - name: Sync version to source files
        id: bump
        shell: bash
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          VER=${TAG#v}
          CURRENT_PKG=$(node -p "require('./package.json').version")
          CURRENT_CARGO=$(grep -E '^version\s*=' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CURRENT_TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CURRENT_PKG" = "$VER" ] && [ "$CURRENT_CARGO" = "$VER" ] && [ "$CURRENT_TAURI" = "$VER" ]; then
            echo "✓ All version files already at $VER, skipping bump"
          else
            echo "Bumping version: pkg=$CURRENT_PKG cargo=$CURRENT_CARGO tauri=$CURRENT_TAURI → $VER"
            # 同步到 package.json
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$VER';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
            # 同步到 Cargo.toml
            sed -i -E "s/^version\s*=\s*\"[^\"]+\"/version = \"$VER\"/" src-tauri/Cargo.toml
            # 同步到 tauri.conf.json
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));p.version='$VER';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(p,null,2)+'\n');"
            # 同步到 Cargo.lock：更新本地 package 的版本记录
            # 避免 bump 后远程构建时 cargo 自动改 Cargo.lock 但不提交，导致本地拉取后出现脏改动
            awk -v ver="$VER" '
              /^name = "wuwa-gacha-tool"$/ { print; found=1; next }
              found && /^version = / { sub(/"[0-9.]+(\.[0-9]+)*"/, "\"" ver "\""); found=0; print; next }
              { print }
            ' src-tauri/Cargo.lock > src-tauri/Cargo.lock.tmp && mv src-tauri/Cargo.lock.tmp src-tauri/Cargo.lock
            echo "✓ Version files prepared for $VER"
          fi

      - name: Upload versioned source files
        uses: actions/upload-artifact@v4
        with:
          name: release-source-files
          path: |
            package.json
            src-tauri/Cargo.toml
            src-tauri/tauri.conf.json
            src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Generate changelog
        shell: bash
        env:
          # latest.json 中包含的历史版本数（含当前版本），调整这里即可
          HISTORY_LIMIT: "5"
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          DATE=$(date -u +'%Y-%m-%d')
          REPO="${GITHUB_REPOSITORY}"

          # ⚠️ push tag 触发时 checkout@v4 在 detached HEAD 状态，
          # 即使 fetch-depth: 0 也可能只拉取当前 commit。
          # 强制 unshallow 拉取完整历史 + 所有 tags。
          git fetch --unshallow 2>/dev/null || true
          git fetch --tags --force 2>/dev/null || true

          echo "=== Debug: local history (last 5 commits) ==="
          git log --oneline -5 || true
          echo "=== Debug: all tags ==="
          git tag --sort=-version:refname || true
          echo "=== End debug ==="
          echo ""

          # 生成两个版本 tag 之间的 release notes（markdown 格式）
          # 参数：$1=起始 tag（不含） $2=结束 tag（含） $3=发布日期
          generate_notes() {
            local START_TAG="$1"
            local END_TAG="$2"
            local RELEASE_DATE="$3"
            # commit 列表从 stdin 读入，调用方决定 range（避免 tag 不存在的问题）
            local COMMITS
            COMMITS=$(cat)

            local FEAT FIX PERF DOCS MAINTENANCE OTHER
            FEAT=$(echo "$COMMITS" | grep -E '^feat(\([^)]*\))?!?:' | sed 's/^/- ✨ /' || true)
            FIX=$(echo "$COMMITS" | grep -E '^fix(\([^)]*\))?!?:' | sed 's/^/- 🐛 /' || true)
            PERF=$(echo "$COMMITS" | grep -E '^perf(\([^)]*\))?!?:' | sed 's/^/- ⚡ /' || true)
            DOCS=$(echo "$COMMITS" | grep -E '^docs(\([^)]*\))?!?:' | sed 's/^/- 📚 /' || true)
            MAINTENANCE=$(echo "$COMMITS" \
              | grep -E '^(refactor|chore|ci)(\([^)]*\))?!?:' \
              | grep -vE '^chore\(release\): bump version' \
              | sed 's/^/- 🔧 /' || true)
            OTHER=$(echo "$COMMITS" \
              | grep -vE '^(feat|fix|perf|refactor|docs|ci|chore)(\([^)]*\))?!?:' \
              | grep -v '^$' \
              | sed 's/^/- 📝 /' || true)

            {
              echo "## 📦 ${END_TAG}"
              echo ""
              echo "> 🗓️ **Release Date:** ${RELEASE_DATE}"
              if [ -n "$START_TAG" ]; then
                echo "> 🔀 **Diff:** [\`${START_TAG}...${END_TAG}\`](https://github.com/${REPO}/compare/${START_TAG}...${END_TAG})"
              fi
              echo ""
              echo "---"
              echo ""

              if [ -n "$FEAT" ]; then
                echo "### ✨ New Features"
                echo ""
                echo "$FEAT"
                echo ""
              fi

              if [ -n "$FIX" ]; then
                echo "### 🐛 Bug Fixes"
                echo ""
                echo "$FIX"
                echo ""
              fi

              if [ -n "$PERF" ]; then
                echo "### ⚡ Performance"
                echo ""
                echo "$PERF"
                echo ""
              fi

              if [ -n "$DOCS" ]; then
                echo "### 📚 Documentation"
                echo ""
                echo "$DOCS"
                echo ""
              fi

              if [ -n "$MAINTENANCE" ]; then
                echo "### 🔧 Maintenance"
                echo ""
                echo "$MAINTENANCE"
                echo ""
              fi

              if [ -n "$OTHER" ]; then
                echo "### 📝 Other"
                echo ""
                echo "$OTHER"
                echo ""
              fi

              if [ -z "$FEAT$FIX$PERF$DOCS$MAINTENANCE$OTHER" ]; then
                echo "_No commits found since last release._"
                echo ""
              fi

              echo "---"
              echo ""
              echo "> ⬇️ **下载文件见下方 Assets 区域**（Windows / Linux 安装包）"
              echo ""
              echo "<sub>🤖 Auto-generated by GitHub Actions</sub>"
            }
          }

          # 1. 生成当前版本的 release-notes.md（给 GitHub Release body 用）
          # 注意：TAG 可能还没创建（workflow_dispatch 触发时 tag 还没打），
          # 所以 git log 终点用 HEAD，显示和链接里仍用 TAG 名
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^${TAG}$" \
            | head -1 \
            || echo "")
          if [ -n "$PREV_TAG" ]; then
            generate_notes "$PREV_TAG" "$TAG" "$DATE" < <(git log --pretty=format:'%s' --no-merges "${PREV_TAG}..HEAD") > release-notes.md
          else
            generate_notes "" "$TAG" "$DATE" < <(git log --pretty=format:'%s' --no-merges HEAD) > release-notes.md
          fi
          echo "Generated changelog for ${TAG}:"
          cat release-notes.md

          # 2. 生成 release-history.json（给 latest.json 用，含最近 N 个版本）
          # 收集最近 HISTORY_LIMIT 个已发布 tag（从高到低排序）
          mapfile -t ALL_TAGS < <(git tag --sort=-version:refname)
          # 过滤出已发布的正式版本 tag（vX.Y.Z 格式）
          RELEASED_TAGS=()
          for t in "${ALL_TAGS[@]}"; do
            if [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASED_TAGS+=("$t")
            fi
          done

          # 构造历史版本列表：
          # - 第一个版本是当前发布版本（用 TAG 标记，但 git range 用 HEAD，因为 tag 还没打）
          # - 后续版本是已发布的旧 tag
          HISTORY_TAGS=("$TAG")
          for t in "${RELEASED_TAGS[@]}"; do
            if [ "$t" = "$TAG" ]; then
              continue
            fi
            HISTORY_TAGS+=("$t")
            if [ "${#HISTORY_TAGS[@]}" -ge "$HISTORY_LIMIT" ]; then
              break
            fi
          done

          echo ""
          echo "=== History versions (${#HISTORY_TAGS[@]}): ${HISTORY_TAGS[*]} ==="

          # 把 tag 列表传给 node
          HISTORY_TAGS_JSON=$(printf '%s\n' "${HISTORY_TAGS[@]}")
          export HISTORY_TAGS_JSON REPO DATE

          # 写 node 脚本到文件再执行，避免 node -e 与 bash 引号嵌套出问题
          # 用 .cjs 后缀，因为 package.json 是 "type": "module"
          cat > gen-history.cjs <<'NODEEOF'
            const { execSync } = require("child_process");
            const fs = require("fs");

            const tags = process.env.HISTORY_TAGS_JSON.trim().split("\n").filter(Boolean);
            const repo = process.env.REPO;
            const today = process.env.DATE;

            function safeExec(cmd) {
              try {
                return execSync(cmd, { encoding: "utf8", stdio: ["pipe", "pipe", "ignore"] }).trim();
              } catch {
                return "";
              }
            }

            function getTagDate(tag, idx) {
              if (idx === 0) return today; // 当前版本用今天
              const out = safeExec(`git log -1 --format=%cd --date=short "${tag}"`);
              return out || today;
            }

            function getCommits(range) {
              const out = safeExec(`git log --pretty=format:"%s" --no-merges "${range}"`);
              if (!out) return [];
              return out.split("\n").filter(Boolean);
            }

            function buildNotes(tag, commits, date, prevTag) {
              const feat = commits.filter(c => /^feat(\([^)]*\))?!?:/.test(c)).map(c => `- ✨ ${c}`).join("\n");
              const fix = commits.filter(c => /^fix(\([^)]*\))?!?:/.test(c)).map(c => `- 🐛 ${c}`).join("\n");
              const perf = commits.filter(c => /^perf(\([^)]*\))?!?:/.test(c)).map(c => `- ⚡ ${c}`).join("\n");
              const docs = commits.filter(c => /^docs(\([^)]*\))?!?:/.test(c)).map(c => `- 📚 ${c}`).join("\n");
              const maintenance = commits
                .filter(c => /^(refactor|chore|ci)(\([^)]*\))?!?:/.test(c))
                .filter(c => !/^chore\(release\): bump version/.test(c))
                .map(c => `- 🔧 ${c}`).join("\n");
              const other = commits
                .filter(c => !/^(feat|fix|perf|refactor|docs|ci|chore)(\([^)]*\))?!?:/.test(c))
                .map(c => `- 📝 ${c}`).join("\n");

              let body = `## 📦 ${tag}\n\n`;
              body += `> 🗓️ **Release Date:** ${date}\n`;
              if (prevTag) {
                body += `> 🔀 **Diff:** [\`${prevTag}...${tag}\`](https://github.com/${repo}/compare/${prevTag}...${tag})\n`;
              }
              body += "\n---\n\n";

              if (feat) body += `### ✨ New Features\n\n${feat}\n\n`;
              if (fix) body += `### 🐛 Bug Fixes\n\n${fix}\n\n`;
              if (perf) body += `### ⚡ Performance\n\n${perf}\n\n`;
              if (docs) body += `### 📚 Documentation\n\n${docs}\n\n`;
              if (maintenance) body += `### 🔧 Maintenance\n\n${maintenance}\n\n`;
              if (other) body += `### 📝 Other\n\n${other}\n\n`;

              if (!feat && !fix && !perf && !docs && !maintenance && !other) {
                body += "_No commits found since last release._\n\n";
              }

              body += "---\n\n";
              body += "> ⬇️ **下载文件见下方 Assets 区域**（Windows / Linux 安装包）\n\n";
              body += "<sub>🤖 Auto-generated by GitHub Actions</sub>";

              return body;
            }

            const history = [];
            for (let i = 0; i < tags.length; i++) {
              const curTag = tags[i];
              const nextTag = tags[i + 1] || "";
              const date = getTagDate(curTag, i);

              // 第一个版本（当前发布版本）用 HEAD 作为终点，因为 tag 还没创建
              // 后续版本用 tag 名
              const endRef = i === 0 ? "HEAD" : curTag;
              const range = nextTag ? `${nextTag}..${endRef}` : endRef;

              const commits = getCommits(range);
              const notes = buildNotes(curTag, commits, date, nextTag);

              history.push({
                version: curTag.replace(/^v/, ""),
                notes,
              });
            }

            fs.writeFileSync("release-history.json", JSON.stringify(history, null, 2));
            console.log(`Generated release-history.json with ${history.length} versions`);
            console.log(JSON.stringify(history.map(h => h.version), null, 2));
          NODEEOF

          node gen-history.cjs

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            release-notes.md
            release-history.json

  # ----------------------------------------------------------------
  # 阶段 2：2 个平台并行 build（windows / linux）
  # ----------------------------------------------------------------
  build-windows:
    name: Build (Windows)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Apply versioned source files
        uses: actions/download-artifact@v4
        with:
          name: release-source-files
          path: .

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 显式签名 NSIS 安装包，确保 .sig 一定生成
      # tauri-action 的隐式签名在某些配置下会被跳过，这里手动兜底
      - name: Sign NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -not -name "*.sig" | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "❌ NSIS installer not found"
            ls -la src-tauri/target/release/bundle/nsis/ || true
            exit 1
          fi
          echo "Signing: $EXE_FILE"
          # 若 .sig 已存在则跳过（tauri-action 可能已经签过）
          if [ -f "${EXE_FILE}.sig" ]; then
            echo "✓ .sig already exists, skipping"
          else
            # tauri signer sign 会自动读取 TAURI_SIGNING_PRIVATE_KEY 和
            # TAURI_SIGNING_PRIVATE_KEY_PASSWORD 环境变量（见 --help 的 [env: ...] 标记）
            npx @tauri-apps/cli signer sign "$EXE_FILE"
          fi
          echo "=== Verification ==="
          ls -la "${EXE_FILE}.sig" || { echo "❌ .sig still missing after sign step"; exit 1; }

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          VER="${RELEASE_TAG#v}"
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -not -name "*.sig" | head -1)
          SIG_FILE="${EXE_FILE}.sig"

          if [ -z "$EXE_FILE" ] || [ ! -f "$SIG_FILE" ]; then
            echo "❌ NSIS installer or signature not found"
            echo "EXE_FILE=$EXE_FILE"
            echo "SIG_FILE=$SIG_FILE"
            ls -la src-tauri/target/release/bundle/nsis/ || true
            exit 1
          fi

          export VER EXE_FILE SIG_FILE
          node -e '
            const fs = require("fs");
            const path = require("path");
            const tag = process.env.RELEASE_TAG;
            const ver = process.env.VER;
            const exeFile = process.env.EXE_FILE;
            const sigFile = process.env.SIG_FILE;
            const repo = process.env.GITHUB_REPOSITORY;

            const exeName = path.basename(exeFile);
            const signature = fs.readFileSync(sigFile, "utf8").trim();
            // GitHub Release 上传 asset 时会把空格替换为点，latest.json 里的 url 须与实际上传后的文件名一致
            const exeNameOnRelease = exeName.replace(/ /g, ".");
            const exeUrl = `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(exeNameOnRelease)}`;
            const notes = fs.readFileSync("release-notes.md", "utf8");

            // 多版本历史（前端用于跨版本更新的分组展示）
            // 如果 release-history.json 不存在（旧分支兼容），则回退为单版本数组
            let history;
            try {
              history = JSON.parse(fs.readFileSync("release-history.json", "utf8"));
            } catch {
              history = [{ version: ver, notes }];
            }

            const json = {
              version: ver,
              notes,
              pub_date: new Date().toISOString(),
              history,
              platforms: {
                "windows-x86_64": {
                  signature,
                  url: exeUrl,
                },
              },
            };

            fs.writeFileSync("latest.json", JSON.stringify(json, null, 2));
            console.log("Generated latest.json:");
            console.log(JSON.stringify({ ...json, platforms: "..." }, null, 2));
            console.log(`History versions: ${history.map(h => h.version).join(", ")}`);
          '

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
          if-no-files-found: error

  build-linux:
    name: Build (Linux)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Apply versioned source files
        uses: actions/download-artifact@v4
        with:
          name: release-source-files
          path: .

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 在 Linux 上需要 webkit2gtk-4.1 + 其他系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn  # Linux 上某些格式可能没装工具

  # ----------------------------------------------------------------
  # 阶段 3：收集所有平台 artifacts，创建 GitHub Release
  # ----------------------------------------------------------------
  release:
    name: Publish Release
    needs: [ prepare, build-windows, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Apply versioned source files
        uses: actions/download-artifact@v4
        with:
          name: release-source-files
          path: .

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "=== Files ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Sizes ==="
          du -sh artifacts/* 2>/dev/null | sort -k2

      - name: Commit version and push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          REMOTE_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$REMOTE_MAIN_SHA" != "$RELEASE_BASE_SHA" ]; then
            echo "❌ main changed during release build"
            echo "Built from: $RELEASE_BASE_SHA"
            echo "Current main: $REMOTE_MAIN_SHA"
            echo "Please rerun the release workflow from the latest main."
            exit 1
          fi

          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              echo "❌ Tag $RELEASE_TAG already exists; refusing to overwrite it for a manual release"
              exit 1
            fi
            TAG_REFSPEC="refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          else
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              echo "❌ Trigger tag $RELEASE_TAG is missing"
              exit 1
            fi
            CURRENT_TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$CURRENT_TAG_SHA" != "$TRIGGER_SHA" ]; then
              echo "❌ Trigger tag moved during the release build"
              echo "Triggered from: $TRIGGER_SHA"
              echo "Current tag: $CURRENT_TAG_SHA"
              exit 1
            fi
            TAG_REFSPEC="+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${RELEASE_TAG#v}"
          else
            echo "✓ Version files already match ${RELEASE_TAG#v}; no bump commit needed"
          fi

          git tag -f "$RELEASE_TAG" HEAD
          git push --atomic origin "HEAD:refs/heads/main" "$TAG_REFSPEC"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Version ${{ needs.prepare.outputs.tag }} 🚀"
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ inputs.draft || false }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/latest.json
          generate_release_notes: true
